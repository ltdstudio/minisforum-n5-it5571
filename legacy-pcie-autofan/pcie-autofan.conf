# Keep disabled until a fan is connected to the N5 PCIe fan header.
ENABLE=0

# Preferred: resolve the source by hwmon chip name and channel.
# Examples on this N5: amdgpu/temp1_input, nvme/temp1_input, eth1/temp1_input.
TEMP_HWMON_NAME=amdgpu
TEMP_CHANNEL=temp1_input

# Alternatively set an explicit path and leave TEMP_HWMON_NAME empty.
TEMP_INPUT=""

TEMP_LOW=45
TEMP_HIGH=75
PWM_LOW=80
PWM_HIGH=255
INTERVAL=10
